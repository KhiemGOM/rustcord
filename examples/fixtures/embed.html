<!doctype html>
<meta charset="utf-8">
<title>Mock Player</title>
<body style="margin:0;background:#123;color:#fff;font:14px sans-serif">
<video id="v" src="/cdn/media/clip.mp4" loop autoplay style="width:100%;height:100%;object-fit:contain"></video>
<script>
const clip = new URLSearchParams(location.search).get('clip');
const log = (k, v) => fetch('/api/v9/mock/embed', { method: 'POST', body: JSON.stringify({ k, clip, v }) });
let top_err = 'none';
try { top.location.href = 'https://example.com/top'; } catch (e) { top_err = e.name; }
log('loaded', {
  referrer: document.referrer,
  cookie: document.cookie,
  token: localStorage.getItem('token'),
  w: innerWidth,
  h: innerHeight,
  top: top_err,
});
if (navigator.mediaDevices) navigator.mediaDevices.getUserMedia({ audio: true }).then(() => log('mic', 'granted'), e => log('mic', e.name));
const v = document.getElementById('v');
v.addEventListener('playing', () => log('playing', { muted: v.muted }), { once: true });
v.addEventListener('pause', () => log('paused', v.currentTime));
let n = 0, resumed = false;
v.addEventListener('pause', () => { resumed = true; });
v.addEventListener('play', () => { if (resumed) log('resumed', v.currentTime); });
v.addEventListener('timeupdate', () => { if (v.currentTime > 0.4 && !n++) log('progress', v.currentTime); });
</script>
