[package]
name = "rustcord"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
arboard = "3.6"
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
chrono = "0.4.45"
cpal = "0.18.2"
davey = "0.1.4"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.36.2"
egui_extras = { version = "0.36.2", default-features = false, features = ["image", "gif", "webp", "file", "svg"] }
emojis = "0.9.0"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
nnnoiseless = { version = "0.5.0", default-features = false }
ogg = "0.9.2"
open = "5.4.4"
openh264 = "0.9.8"
# vencord plugins: quickjs runs them, oxc turns their typescript and jsx into javascript
oxc = { version = "0.156.0", features = ["transformer", "codegen", "semantic"] }
opus-rs = "0.1.37"
raw-window-handle = "0.6"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart", "gzip", "http2"] }
rfd = "0.17.2"
rquickjs = { version = "0.14.0", features = ["loader"] }
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
wuff = { version = "0.2.9", default-features = false, features = ["brotli"] }
windows = { version = "0.62.2", features = [
    "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging",
    "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_Speech", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Data_Xml_Dom", "Foundation", "UI_Notifications",
    "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Graphics_Gdi",
    "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader"] }

[build-dependencies]
# the exe's icon: discord's own
winresource = "0.1"

[dev-dependencies]
# the mock serves a system font as woff2 so the client's gg sans download path runs for real
ttf2woff2 = { version = "0.13.3", default-features = false }
# the mock voice server plays Discord's part in DAVE: MLS external sender plus a second member
openmls = "0.8.2"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
