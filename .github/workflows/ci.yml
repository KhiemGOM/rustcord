name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --locked --release --bin fastcord --example mockcord
      - name: software opengl (mesa llvmpipe)
        shell: pwsh
        run: |
          curl.exe -fsSL -o mesa.7z https://github.com/pal1000/mesa-dist-win/releases/download/26.2.4/mesa3d-26.2.4-release-msvc.7z
          7z x mesa.7z -omesa -y | Out-Null
          Copy-Item mesa/x64/*.dll target/release/
          Copy-Item mesa/x64/*.dll target/release/examples/
          "GALLIUM_DRIVER=llvmpipe" >> $env:GITHUB_ENV
          "MESA_GL_VERSION_OVERRIDE=4.5" >> $env:GITHUB_ENV
          "MESA_GLSL_VERSION_OVERRIDE=450" >> $env:GITHUB_ENV
      - name: screen resolution
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System;
          using System.Runtime.InteropServices;
          [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
          public struct DEVMODE {
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
            public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra;
            public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput;
            public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate;
            [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
            public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight;
            public int dmDisplayFlags; public int dmDisplayFrequency;
            public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType; public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight;
          }
          public static class Disp {
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern bool EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          "@
          $dev = '\\.\DISPLAY1'
          $best = $null
          for ($i = 0; ; $i++) {
            $dm = New-Object DEVMODE
            $dm.dmSize = [int][Runtime.InteropServices.Marshal]::SizeOf($dm)
            if (-not [Disp]::EnumDisplaySettings($dev, $i, [ref]$dm)) { break }
            if ($dm.dmPelsWidth -le 1920 -and ($null -eq $best -or $dm.dmPelsWidth * $dm.dmPelsHeight -ge $best.dmPelsWidth * $best.dmPelsHeight)) { $best = $dm }
          }
          "using $($best.dmPelsWidth)x$($best.dmPelsHeight)"
          $best.dmFields = 0x180000
          "change: $([Disp]::ChangeDisplaySettings([ref]$best, 0))"
      - name: e2e against the mock
        shell: bash
        run: |
          python e2e/run.py --no-build || true
          python -c "
          import json, re, sys
          r = json.load(open('e2e/artifacts/report.json'))['checks']
          bad = [k for k, v in r.items() if not v and not re.search(r'< \d+ms$', k)]
          print(len(r), 'checks,', len(bad), 'failed')
          print(*bad, sep=chr(10))
          sys.exit(1 if bad else 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: e2e/artifacts
